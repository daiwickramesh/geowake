version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: geowake_postgres
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: geowakedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: geowake_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
